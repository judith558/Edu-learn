<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses | EduLearn</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav-bar">
      <a href="index.html" class="logo">
        <span class="logo-icon">&lt;/&gt;</span>
        Edu<span class="light">Learn</span>
      </a>
      <button class="menu-toggle" aria-label="Open menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="tutorial.html">Tutorials</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="about.html">About &amp; Progress</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Available Courses</h1>
        <p>Pick a topic and start learning at your own pace</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Topic filters and search -->
        <div class="filter-bar">
          <div class="filter-buttons">
            <button class="filter-btn active" data-topic="all">All</button>
            <button class="filter-btn" data-topic="html">HTML</button>
            <button class="filter-btn" data-topic="css">CSS</button>
            <button class="filter-btn" data-topic="javascript">JavaScript</button>
          </div>
          <input type="text" id="courseSearch" class="filter-search" placeholder="Search courses...">
        </div>

        <!-- Course cards (filled in by script.js) -->
        <div class="card-grid" id="courseGrid"></div>
        <p class="no-results" id="noResults">No courses match your search. Try another word or topic.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> EduLearn &middot; A group project for learning HTML, CSS &amp; JavaScript</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
